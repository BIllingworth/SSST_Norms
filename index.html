<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Z-score Percentile Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
  background: white;
  border-radius: 10px;
}

.output {
  font-size: 24px;
  margin-top: 10px;
  color: blue;
}

svg {
  width: 100%;
  height: 300px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Z-score → Percentile</h1>

  <input id="zInput" type="number" step="0.01" value="0">
  <input id="zSlider" type="range" min="-4" max="4" step="0.01" value="0">

  <div class="output" id="output">50%</div>

  <svg id="chart"></svg>
</div>

<script>
function erf(x){
  const a1=0.254829592,a2=-0.284496736,a3=1.421413741,
        a4=-1.453152027,a5=1.061405429,p=0.3275911;
  const sign = x<0?-1:1;
  x=Math.abs(x);
  const t=1/(1+p*x);
  const y=1-((((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
  return sign*y;
}

function normCDF(z){
  return (1+erf(z/Math.sqrt(2)))/2;
}

function update(z){
  const p=normCDF(z)*100;
  document.getElementById("output").innerText=p.toFixed(2)+"%";
}

document.getElementById("zInput").addEventListener("input", e=>update(+e.target.value));
document.getElementById("zSlider").addEventListener("input", e=>update(+e.target.value));

update(0);
</script>

</body>
</html>
