<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personalised Percentile Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<style>
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
margin: 0;
}

.container {
max-width: 900px;
margin: 40px auto;
background: white;
padding: 20px;
border-radius: 10px;
}

h1 { margin-top: 0; }

input, select {
padding: 6px;
margin: 5px 0;
}

.output {
font-size: 22px;
margin-top: 10px;
color: #1f6feb;
}

svg {
width: 100%;
height: 320px;
}
</style>
</head>

<body>

<div class="container">
<h1>Personalised Percentile Calculator</h1>

<p>Enter score, age, and sex:</p>

<label>Score:</label><br>
<input id="score" type="number"><br>

<label>Age:</label><br>
<input id="age" type="number"><br>

<label>Sex:</label><br>
<select id="sex">
<option value="female">Female</option>
<option value="male">Male</option>
</select><br><br>

<button onclick="calculate()">Calculate</button>

<div class="output" id="result"></div>

<h3>Distribution</h3>
<svg id="chart"></svg>
</div>

<script>

// ---- MODEL COEFFICIENTS (REPLACE THESE) ----
const b0 = 49.44;
const bAge = 0.24;
const bMale = -1.28;
const sigma = 5.253;

// ---- Normal CDF ----
function erf(x){
const a1=0.254829592,a2=-0.284496736,a3=1.421413741,
a4=-1.453152027,a5=1.061405429,p=0.3275911;
const sign = x<0?-1:1;
x=Math.abs(x);
const t=1/(1+p*x);
const y=1-((((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x));
return sign*y;
}

function normCDF(z){
return (1+erf(z/Math.sqrt(2)))/2;
}

// ---- CALCULATION ----
function calculate(){

const score = parseFloat(document.getElementById("score").value);
const age = parseFloat(document.getElementById("age").value);
const sex = document.getElementById("sex").value;

if(isNaN(score) || isNaN(age)){
alert("Enter valid inputs");
return;
}

const male = (sex === "male") ? 1 : 0;

const predicted = b0 + bAge*age + bMale*male;
const residual = score - predicted;
const z = residual / sigma;
const percentile = normCDF(z) * 100;

document.getElementById("result").innerHTML =
`Predicted = ${predicted.toFixed(2)}<br>
z = ${z.toFixed(2)}<br>
Percentile = ${percentile.toFixed(1)}%`;

draw(z);
}

// ---- PLOT ----
function draw(zHighlight) {

const svg = d3.select("#chart");
svg.selectAll("*").remove();

const width = 600, height = 300;
const margin = 40;

const x = d3.scaleLinear().domain([-4,4]).range([margin, width-margin]);
const y = d3.scaleLinear().domain([0,0.4]).range([height-margin, margin]);

function pdf(x){
return Math.exp(-0.5*x*x)/Math.sqrt(2*Math.PI);
}

const data = d3.range(-4,4.01,0.1).map(d => ({x:d,y:pdf(d)}));

const line = d3.line()
.x(d => x(d.x))
.y(d => y(d.y));

svg.append("path")
.datum(data)
.attr("d", line)
.attr("fill","none")
.attr("stroke","#1f6feb")
.attr("stroke-width",2);

// highlight user point
svg.append("circle")
.attr("cx", x(zHighlight))
.attr("cy", y(pdf(zHighlight)))
.attr("r",6)
.attr("fill","red");

svg.append("line")
.attr("x1", x(zHighlight))
.attr("x2", x(zHighlight))
.attr("y1", y(0))
.attr("y2", y(pdf(zHighlight)))
.attr("stroke","red")
.attr("stroke-dasharray","4");
}

</script>

</body>
</html>
